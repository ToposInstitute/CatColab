name: deploy

on:
  workflow_call:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  create_deployment:
    name: Create Netlify GitHub deployment
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == 'ToposInstitute/CatColab')
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    steps:
      - name: Create new GitHub deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: ${{ github.ref == 'refs/heads/production' && 'netlify-production' || github.ref == 'refs/heads/main' && 'netlify-next' || 'netlify-preview' }}
          ref: ${{ github.head_ref || github.ref_name }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          transient-environment: ${{ github.event_name == 'pull_request' }}
          production-environment: ${{ github.ref == 'refs/heads/production' }}
          auto-inactive: true
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Update deployment status to in_progress
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          description: 'Building and deploying...'
          state: 'in_progress'
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == 'ToposInstitute/CatColab'
    outputs:
      deploy_url: ${{ steps.url_preview.outputs.NETLIFY_PREVIEW_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Netlify
        run: |
          cd .netlify-env
          pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Consolidate and deploy to Staging
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        id: netlify_deploy
        run: |
          mv app site/
          mv gaios site/gaios
          mv dev-docs site/dev
          mv rust_docs site/dev/rust
          mv frontend_docs site/dev/frontend
          mv ui-components site/dev/ui-components
          mv math-docs site/math
          mv rfc site/rfc
          # Patchwork shells load the gaios plugin cross-origin, so its
          # package.json and module files need permissive CORS headers.
          printf '/gaios/*\n  Access-Control-Allow-Origin: *\n' >> site/_headers
          echo '/dev/rust /dev/rust/catlog' >> site/_redirects
          echo '/dev/core /dev/rust/catlog' >> site/_redirects
          echo '/dev/backend /dev/rust/backend' >> site/_redirects
          echo '/dev/catcolab_backend /dev/rust/backend' >> site/_redirects
          echo '/math /math/index.xml' >> site/_redirects
          echo '/maths /math/index.xml' >> site/_redirects
          echo '/* /index.html 200' >> site/_redirects
          cd .netlify-env
          branch_flag=""
          if [ "$BRANCH_NAME" = "main" ]; then branch_flag="--prod"; else branch_flag="--alias='branch-$BRANCH_NAME'"; fi
          npx netlify deploy --dir ../site --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_API_TOKEN }} $branch_flag --json > ../deploy_output.json

      - name: Consolidate and deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        run: |
          mv app site/
          mv gaios site/gaios
          # Patchwork shells load the gaios plugin cross-origin, so its
          # package.json and module files need permissive CORS headers.
          printf '/gaios/*\n  Access-Control-Allow-Origin: *\n' >> site/_headers
          echo '/* /index.html 200' >> site/_redirects
          cd .netlify-env
          npx netlify deploy --dir ../site --site ${{ secrets.NETLIFY_PROD_SITE_ID }} --auth ${{ secrets.NETLIFY_API_TOKEN }} --prod

      - name: Generate URL preview
        id: url_preview
        if: env.BRANCH_NAME != 'main' && github.event_name == 'pull_request'
        run: |
          NETLIFY_PREVIEW_URL=$(jq -r '.deploy_url' deploy_output.json)
          echo "NETLIFY_PREVIEW_URL=$NETLIFY_PREVIEW_URL" >> "$GITHUB_OUTPUT"

  report_deployment_status:
    name: Report Netlify deployment status
    runs-on: ubuntu-latest
    needs: [create_deployment, deploy]
    if: always() && needs.create_deployment.result == 'success'
    steps:
      - name: Delete old deployments
        if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.BRANCH_NAME,
              environment: 'netlify-preview'
            });
            
            console.log(`Found ${deployments.length} existing deployment(s)`);
            
            const currentDeploymentId = parseInt('${{ needs.create_deployment.outputs.deployment_id }}');
            
            for (const deployment of deployments) {
              if (deployment.id !== currentDeploymentId) {
                console.log(`Deleting old deployment ${deployment.id}`);
                
                // A deployment must be marked inactive before it can be deleted
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Superseded by newer deployment'
                });
                
                await github.rest.repos.deleteDeployment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id
                });
                
                console.log(`Deleted deployment ${deployment.id}`);
              }
            }

      - name: Update deployment status to success
        if: needs.deploy.result == 'success'
        uses: chrnorm/deployment-status@v2
        # The deployment may have already been deleted by another run so we need to be ok with errors
        continue-on-error: true
        with:
          token: ${{ github.token }}
          environment-url: ${{ github.ref == 'refs/heads/production' && 'https://catcolab.org' || github.ref == 'refs/heads/main' && 'https://next.catcolab.org' || needs.deploy.outputs.deploy_url }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ github.ref == 'refs/heads/production' && 'Netlify production deployment' || github.ref == 'refs/heads/main' && 'Netlify staging deployment' || 'Netlify preview deployment' }}
          state: 'success'
          deployment-id: ${{ needs.create_deployment.outputs.deployment_id }}

      - name: Update deployment status to failure
        if: needs.deploy.result != 'success'
        uses: chrnorm/deployment-status@v2
        # The deployment may have already been deleted by another run so we need to be ok with errors
        continue-on-error: true
        with:
          token: ${{ github.token }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: 'Deployment failed'
          state: 'failure'
          deployment-id: ${{ needs.create_deployment.outputs.deployment_id }}

  create_backend_deployment:
    name: Create backend GitHub deployment
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    steps:
      - name: Create new GitHub deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: ${{ github.ref == 'refs/heads/production' && 'backend-production' || 'backend-next' }}
          ref: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          auto-inactive: true
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Update deployment status to in_progress
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          description: 'Deploying backend to AWS...'
          state: 'in_progress'
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}

  deploy_backend:
    name: Deploy backend to AWS
    runs-on: ubuntu-latest
    needs: [create_backend_deployment]
    env:
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/production' && 'catcolab' || 'catcolab-next' }}
      DEPLOY_HOST: ${{ github.ref == 'refs/heads/production' && 'backend.catcolab.org' || 'backend-next.catcolab.org' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          fallback = true
          download-attempts = 5

    - name: Configure Cachix
      uses: cachix/cachix-action@v17
      with:
        name: topos-institute
        authToken: '${{ secrets.CACHIX_TOPOS_AUTH_TOKEN }}'

    - name: Set the SSH key for deployment
      env:
        DEPLOY_KEY: ${{ secrets[github.ref == 'refs/heads/production' && 'CATCOLAB_PROD_DEPLOYUSER_KEY' || 'CATCOLAB_NEXT_DEPLOYUSER_KEY'] }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "ERROR: Deployment SSH key is not configured for $DEPLOY_TARGET"
          exit 1
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - name: Deploy backend
      run: |
        nix run .#deploy-rs -- --skip-checks ".#$DEPLOY_TARGET"

    - name: Verify deployment
      run: |
        EXPECTED=$(nix eval --raw ".#nixosConfigurations.$DEPLOY_TARGET.config.system.build.toplevel")
        ACTUAL=$(ssh "catcolab@$DEPLOY_HOST" "readlink -f /run/current-system")

        if [[ "$ACTUAL" != "$EXPECTED" ]]; then
          echo "ERROR: Deployment verification failed, the server is not running the expected nix profile"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          exit 1
        fi

        echo "Deployment verified: $ACTUAL"

    # Ensure that a copy of the deployed repository is on the machine that it was deployed to. This is
    # a nice-to-have which enables checking the configuration of the currently deployed system and could
    # make recovery slightly less aweful in the event nix commands need to be run on the remote.
    - name: Rsync the repo to remote host
      run: |
         rsync -az --delete ./ "catcolab@$DEPLOY_HOST:~/catcolab"

  report_backend_deployment_status:
    name: Report backend deployment status
    runs-on: ubuntu-latest
    needs: [create_backend_deployment, deploy_backend]
    if: always() && needs.create_backend_deployment.result == 'success'
    steps:
      - name: Update deployment status to success
        if: needs.deploy_backend.result == 'success'
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment-url: ${{ github.ref == 'refs/heads/production' && 'https://backend.catcolab.org' || 'https://backend-next.catcolab.org' }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: 'Backend deployed to AWS'
          state: 'success'
          deployment-id: ${{ needs.create_backend_deployment.outputs.deployment_id }}

      - name: Update deployment status to failure
        if: needs.deploy_backend.result != 'success'
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: 'Backend deployment failed'
          state: 'failure'
          deployment-id: ${{ needs.create_backend_deployment.outputs.deployment_id }}

      - name: Post commit status
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ needs.deploy_backend.result }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.sha }}',
              state: state,
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: state === 'success' ? 'Backend deployed to AWS' : 'Backend deployment failed',
              context: 'deploy / backend'
            });
