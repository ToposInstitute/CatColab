# 9 days, in minutes
minimumReleaseAge: 12960
minimumReleaseAgeExclude:
  - "@automerge/automerge"
packages:
  - "dev-docs"
  - "packages/backend/pkg"
  - "packages/frontend"
  - "packages/document-methods"
  - "packages/documents"
  - "packages/logics"
  - "packages/ui-components"
  - "packages/gaios"
  - "tools/oxlint-plugin-catcolab"
  - "tools/vite-plugin-monorepo-dedupe"
# Fix Automerge's `applyPatches` for map key insertions/deletions (upstream fix
# in https://github.com/automerge/automerge/pull/1308), which `revertCommit`
# relies on to invert diffs. Can be removed once this is released.
patchedDependencies:
  "@automerge/automerge@3.5.0": patches/@automerge__automerge@3.5.0.patch
# Not every workspace package depends on the patched packages.
allowUnusedPatches: true
