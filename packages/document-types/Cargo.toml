[package]
name = "catcolab-document-types"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "migrate_examples"
path = "src/bin/migrate_examples.rs"

[features]
backend = ["dep:autosurgeon", "dep:ts-rs"]
property-tests = ["backend", "dep:proptest", "dep:test-strategy"]

[dependencies]
automerge = "0.11.0"
autosurgeon = { version = "0.13.0", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.143"
ts-rs = { version = "11.1.0", optional = true }
tsify = { version = "0.5.6", features = ["js"] }
ustr = { version = "1.1.0", features = ["serde"] }
uuid = { version = "1.18", features = ["serde"] }
wasm-bindgen = "0.2.106"

proptest = { version = "1.9.0", optional = true }
test-strategy = { version = "0.4", optional = true }

[lints.clippy]
doc_paragraphs_missing_punctuation = "warn"
