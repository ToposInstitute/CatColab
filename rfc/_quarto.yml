project:
  type: website
  preview:
    port: 3950

website:
  title: "CatColab RFCs"
  # Navigation
  sidebar:
    style: "docked"
    collapse-level: 1
    contents:
      - index.md
      - auto: "*.md"
  # GitHub links
  repo-url: https://github.com/ToposInstitute/CatColab
  repo-subdir: rfc
  repo-actions: [source, issue]

format:
  html:
    # General styling
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    respect-user-color-scheme: true
    # RFC rendering
    html-math-method: katex
    # Syntax highlighting: add TSX (TypeScript + JSX) grammar, which is not
    # bundled with Pandoc/Skylighting. Resolves `##TypeScript`/`##JavaScript`
    # references against Skylighting's built-in grammars.
    syntax-definitions:
      - _typescript-react.xml
    toc: true
    toc-depth: 5
    toc-expand: true
    number-sections: true
    date-format: YYYY-MM-DD
    csl: chicago-author-date.csl

filters:
  - filters.lua
